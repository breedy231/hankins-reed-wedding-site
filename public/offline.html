<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Reed Wedding</title>
    <meta name="theme-color" content="#d946ef" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: linear-gradient(to bottom, #fdf4ff, #ffffff);
        color: #171717;
        text-align: center;
      }
      .icon {
        font-size: 4rem;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.75rem;
        margin-bottom: 1rem;
        color: #171717;
      }
      p {
        font-size: 1.125rem;
        color: #525252;
        max-width: 400px;
        line-height: 1.6;
      }
      .retry-btn {
        margin-top: 2rem;
        padding: 0.875rem 2rem;
        font-size: 1rem;
        font-weight: 500;
        color: #ffffff;
        background-color: #d946ef;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: background-color 0.2s;
        min-height: 48px;
        min-width: 48px;
      }
      .retry-btn:hover {
        background-color: #c026d3;
      }
      .retry-btn:focus {
        outline: 2px solid #d946ef;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="icon" aria-hidden="true">📶</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. Don't worry - once you're back online,
      you can continue exploring the wedding details.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
  </body>
</html>
